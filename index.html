<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Casamento da Constança e do Diogo, 24 de julho de 2027, Aldeia do Carvalhal, Bombarral.">
</head>
<body style="margin:0">
<title>Constança & Diogo · Letras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Jost:wght@300;400;500&family=Marcellus&family=Manrope:wght@300;400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* chooser: one row per colour version, five lettering cards each, names rendered live in each typeface */
:root{--bg:#F7F1E6;--ink:#13254A;--ink2:#5A6680;--accent:#E0592A;--line:#E2D7C4;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.5 "Figtree",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding-block:48px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-weight:500;font-size:clamp(30px,4.4vw,48px);line-height:1.05;margin:0 0 10px;letter-spacing:-.02em}
.lead{color:var(--ink2);max-width:58ch;margin:0 0 36px}
.row{margin-bottom:44px}
.row h2{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{text-decoration:none;color:inherit;display:grid;gap:8px}
.mini{display:grid;grid-template-columns:1.1fr 1fr;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--p);box-shadow:0 14px 30px -20px rgba(19,37,74,.5);transition:transform .25s}
.card:hover .mini{transform:translateY(-3px)}
.nm{display:grid;align-content:center;padding:10px 6px 10px 12px;color:var(--i);font-size:27px;line-height:1.02;min-width:0;overflow:hidden}
.nm .am{font-size:.6em;opacity:.85}
.nm .dg{color:var(--a)}
.mini img{width:100%;height:100%;object-fit:cover;min-width:0}
.lb{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lb b{font-weight:600;font-size:15px}
.lb span{color:var(--ink2);font-size:13px}
.f-classica{font-family:"EB Garamond", Garamond, Georgia, serif}.f-editorial{font-family:"Instrument Serif", "Times New Roman", Georgia, serif}.f-moderna{font-family:"Jost", "Futura", "Century Gothic", system-ui, sans-serif}.f-romana{font-family:"Marcellus", "Trajan Pro", Georgia, serif}.f-contemporanea{font-family:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif}.f-moderna .nm,.f-romana .nm{text-transform:uppercase;letter-spacing:.09em;font-size:24px}.f-moderna .nm{font-weight:300}.f-contemporanea .nm{font-weight:300;letter-spacing:-.03em}
.lb{font-family:"Figtree",system-ui,sans-serif}
</style>
<div class="wrap">
<h1>Constança &amp; Diogo </h1>
<p class="lead">Três versões do site com a letra clássica. Toquem numa para abrir o site completo.</p>
<section class="row"><div class="cards"><a class="card f-classica" href="azul.html"><div class="mini" style="--p:#1E4FA3;--i:#FFF8EE;--a:#FFB28F"><div class="nm"><span>Constança</span><span class="am">&amp;</span><span class="dg">Diogo</span></div><img src="fotos/praia-2.jpg" alt="" loading="lazy" style="object-position:50% 40%"></div><p class="lb"><b>Azul</b><span>Abrir site</span></p></a><a class="card f-classica" href="quadrados.html"><div class="mini" style="--p:#17868A;--i:#FFF8EE;--a:#FF9A5A"><div class="nm"><span>Constança</span><span class="am">&amp;</span><span class="dg">Diogo</span></div><img src="fotos/casamento-terraco.jpg" alt="" loading="lazy" style="object-position:50% 30%"></div><p class="lb"><b>Quadrados</b><span>Abrir site</span></p></a><a class="card f-classica" href="riscas.html"><div class="mini" style="--p:#1E2540;--i:#F6F3EC;--a:#9FB9EE"><div class="nm"><span>Constança</span><span class="am">&amp;</span><span class="dg">Diogo</span></div><img src="fotos/riscas-1.jpg" alt="" loading="lazy" style="object-position:52% 45%"></div><p class="lb"><b>Riscas</b><span>Abrir site</span></p></a></div></section>
</div>
</body>
</html>
